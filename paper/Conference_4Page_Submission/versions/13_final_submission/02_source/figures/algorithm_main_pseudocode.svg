   <g id="text_1">
    <text style="font-weight: 700; font-size: 7.15px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #425466" x="13.32" y="11.282342" transform="rotate(-0 13.32 11.282342)">1  INPUT + SETUP</text>
   </g>
   <g id="text_2">
    <text style="font-size: 6.35px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #253746" x="13.32" y="21.443311" transform="rotate(-0 13.32 21.443311)">Current UAV state; latest 10 obstacle observations.</text>
   </g>
   <g id="text_3">
    <text style="font-size: 6.35px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #253746" x="13.32" y="28.571249" transform="rotate(-0 13.32 28.571249)">Carry the previous MPC sequence when available.</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 7.15px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #16877d" x="13.32" y="45.122342" transform="rotate(-0 13.32 45.122342)">2  SHARED LSTM FORECAST</text>
   </g>
   <g id="text_5">
    <text style="font-size: 6.35px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #253746" x="13.32" y="55.283249" transform="rotate(-0 13.32 55.283249)">Predict 30 time-aligned obstacle positions (3 s).</text>
   </g>
   <g id="text_6">
    <text style="font-size: 6.35px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #253746" x="13.32" y="62.411311" transform="rotate(-0 13.32 62.411311)">Send the same forecast to MPC and DWA.</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 7.15px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #4b729d" x="13.32" y="78.242272" transform="rotate(-0 13.32 78.242272)">3a  MPC | route guide</text>
   </g>
   <g id="text_8">
    <text style="font-size: 6.35px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #253746" x="13.32" y="88.403311" transform="rotate(-0 13.32 88.403311)">Start: solve with forecast.</text>
   </g>
   <g id="text_9">
    <text style="font-size: 6.35px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #253746" x="13.32" y="95.531249" transform="rotate(-0 13.32 95.531249)">Later: shift prior guide.</text>
   </g>
   <g id="text_10">
    <text style="font-size: 6.35px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #253746" x="13.32" y="102.659311" transform="rotate(-0 13.32 102.659311)">Compute trust for DWA.</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 7.15px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #a86c20" x="138.6" y="78.242272" transform="rotate(-0 138.6 78.242272)">3b  DWA | safe action</text>
   </g>
   <g id="text_12">
    <text style="font-size: 6.35px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #253746" x="138.6" y="88.403249" transform="rotate(-0 138.6 88.403249)">Use guide; split samples.</text>
   </g>
   <g id="text_13">
    <text style="font-size: 6.35px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #253746" x="138.6" y="95.531311" transform="rotate(-0 138.6 95.531311)">Roll out reachable controls.</text>
   </g>
   <g id="text_14">
    <text style="font-size: 6.35px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #253746" x="138.6" y="102.659311" transform="rotate(-0 138.6 102.659311)">Screen, then score.</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 7.15px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #4b729d" x="13.32" y="132.962342" transform="rotate(-0 13.32 132.962342)">4  SELECT + SAFETY RE-SCREEN</text>
   </g>
   <g id="text_16">
    <text style="font-size: 6.2px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #253746" x="13.32" y="143.084492" transform="rotate(-0 13.32 143.084492)">Normal set: choose safe DWA action and first-input box.</text>
   </g>
   <g id="text_17">
    <text style="font-size: 6.2px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #253746" x="13.32" y="150.212432" transform="rotate(-0 13.32 150.212432)">Recenter only when predicted clearance &gt;1 m and cross-track &gt;0.5 m;</text>
   </g>
   <g id="text_18">
    <text style="font-size: 6.2px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #253746" x="13.32" y="157.340432" transform="rotate(-0 13.32 157.340432)">re-screen the change, or revert to the original action.</text>
   </g>
   <g id="text_19">
    <text style="font-size: 6.2px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #253746" x="13.32" y="164.468432" transform="rotate(-0 13.32 164.468432)">No normal set: screen/recheck emergency; stop if none passes.</text>
   </g>
   <g id="text_20">
    <text style="font-weight: 700; font-size: 7.15px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #425466" x="13.32" y="184.802342" transform="rotate(-0 13.32 184.802342)">5  RE-SOLVE + EXECUTE</text>
   </g>
   <g id="text_21">
    <text style="font-size: 6.35px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #253746" x="13.32" y="194.963249" transform="rotate(-0 13.32 194.963249)">Re-solve MPC on this forecast (safe box if present).</text>
   </g>
   <g id="text_22">
    <text style="font-size: 6.35px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #253746" x="13.32" y="202.091249" transform="rotate(-0 13.32 202.091249)">Apply screened action for 0.1 s; update and repeat.</text>
   </g>
  </g>
 </g>
