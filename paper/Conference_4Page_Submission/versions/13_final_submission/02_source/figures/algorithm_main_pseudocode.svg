   <g id="text_1">
    <text style="font-weight: 700; font-size: 8.15px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #253746" x="28.108421" y="10.253423" transform="rotate(-0 28.108421 10.253423)">SHARED-FORECAST MPC--DWA  |  ONE UPDATE</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 6.35px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #16877d" x="28.108421" y="20.462974" transform="rotate(-0 28.108421 20.462974)">ONE FUTURE  |  TWO TIME SCALES  |  SCREENED EXECUTION</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 7.6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #425466" x="35.298947" y="35.446797" transform="rotate(-0 35.298947 35.446797)">1  OBSERVE</text>
   </g>
   <g id="text_4">
    <text style="font-size: 7.1px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #253746" x="35.298947" y="43.957333" transform="rotate(-0 35.298947 43.957333)">Read UAV state, goal, 10 obstacle observations and prior route.</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 7.55px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #16877d" x="35.298947" y="64.953857" transform="rotate(-0 35.298947 64.953857)">2  PREDICT ONCE + BROADCAST</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7.05px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #253746" x="35.298947" y="73.464394" transform="rotate(-0 35.298947 73.464394)">LSTM predicts 30 time-aligned obstacle positions over 3 s.</text>
   </g>
   <g id="text_7">
    <text style="font-size: 7.05px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #253746" x="35.298947" y="81.744394" transform="rotate(-0 35.298947 81.744394)">The identical sequence enters MPC and every DWA rollout.</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 7.3px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #4b729d" x="35.298947" y="106.289089" transform="rotate(-0 35.298947 106.289089)">3a  MPC | LOOK AHEAD</text>
   </g>
   <g id="text_9">
    <text style="font-size: 6.9px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #253746" x="35.298947" y="114.467599" transform="rotate(-0 35.298947 114.467599)">Optimize a 30-step route.</text>
   </g>
   <g id="text_10">
    <text style="font-size: 6.9px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #253746" x="35.298947" y="122.745645" transform="rotate(-0 35.298947 122.745645)">Penalize future encounters;</text>
   </g>
   <g id="text_11">
    <text style="font-size: 6.9px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #253746" x="35.298947" y="131.025577" transform="rotate(-0 35.298947 131.025577)">set guide + trust.</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 7.3px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #a86c20" x="147.078947" y="106.289089" transform="rotate(-0 147.078947 106.289089)">3b  DWA | ACT NOW</text>
   </g>
   <g id="text_13">
    <text style="font-size: 6.9px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #253746" x="147.078947" y="114.465645" transform="rotate(-0 147.078947 114.465645)">Sample reachable controls.</text>
   </g>
   <g id="text_14">
    <text style="font-size: 6.9px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #253746" x="147.078947" y="122.745645" transform="rotate(-0 147.078947 122.745645)">Screen 30-step rollouts;</text>
   </g>
   <g id="text_15">
    <text style="font-size: 6.9px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #253746" x="147.078947" y="131.025645" transform="rotate(-0 147.078947 131.025645)">score survivors.</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 6.78px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #253746" x="132.697895" y="152.594524" transform="rotate(-0 132.697895 152.594524)">4  GATE  |  IS THE NORMAL DWA SAFE SET NONEMPTY?</text>
   </g>
   <g id="text_17">
    <text style="font-weight: 700; font-size: 7.3px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #16877d" x="35.298947" y="172.169089" transform="rotate(-0 35.298947 172.169089)">YES  |  NORMAL</text>
   </g>
   <g id="text_18">
    <text style="font-size: 6.9px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #253746" x="35.298947" y="180.705645" transform="rotate(-0 35.298947 180.705645)">Choose best screened action.</text>
   </g>
   <g id="text_19">
    <text style="font-size: 6.9px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #253746" x="35.298947" y="188.985577" transform="rotate(-0 35.298947 188.985577)">Re-screen any recentering.</text>
   </g>
   <g id="text_20">
    <text style="font-weight: 700; font-size: 7.3px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #a45b4a" x="142.503158" y="172.169089" transform="rotate(-0 142.503158 172.169089)">NO  |  EMERGENCY</text>
   </g>
   <g id="text_21">
    <text style="font-size: 6.9px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #253746" x="142.503158" y="180.705577" transform="rotate(-0 142.503158 180.705577)">Screen emergency actions.</text>
   </g>
   <g id="text_22">
    <text style="font-size: 6.9px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #253746" x="142.503158" y="188.985645" transform="rotate(-0 142.503158 188.985645)">If none passes, stop.</text>
   </g>
   <g id="text_23">
    <text style="font-weight: 700; font-size: 7.35px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #425466" x="35.298947" y="213.2221" transform="rotate(-0 35.298947 213.2221)">5  FEEDBACK + EXECUTE</text>
   </g>
   <g id="text_24">
    <text style="font-size: 6.7px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #253746" x="35.298947" y="220.253821" transform="rotate(-0 35.298947 220.253821)">Bound next MPC input with safe DWA ranges; execute 0.1 s.</text>
   </g>
   <g id="text_25">
    <text style="font-size: 6.7px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #253746" x="35.298947" y="228.535784" transform="rotate(-0 35.298947 228.535784)">Observe the scene and repeat.</text>
   </g>
