   <g id="text_1">
    <text style="font-weight: 700; font-size: 8.3px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #253746" x="28.108421" y="11.082627" transform="rotate(-0 28.108421 11.082627)">SHARED-FORECAST PLANNER  |  UPDATE LOOP</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 7.75px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #425466" x="35.298947" y="23.965615" transform="rotate(-0 35.298947 23.965615)">1  OBSERVE + INITIALIZE</text>
   </g>
   <g id="text_3">
    <text style="font-size: 7.25px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #253746" x="35.298947" y="32.47615" transform="rotate(-0 35.298947 32.47615)">Read UAV state, goal, 10 observations and previous route.</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 7.75px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #16877d" x="35.298947" y="52.765615" transform="rotate(-0 35.298947 52.765615)">2  PREDICT ONCE, SHARE</text>
   </g>
   <g id="text_5">
    <text style="font-size: 7.25px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #253746" x="35.298947" y="61.27615" transform="rotate(-0 35.298947 61.27615)">Causal LSTM predicts 30 time-aligned obstacle positions (3 s).</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7.25px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #253746" x="35.298947" y="69.556221" transform="rotate(-0 35.298947 69.556221)">Broadcast this same forecast to MPC and DWA.</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 7.55px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #4b729d" x="35.298947" y="98.073784" transform="rotate(-0 35.298947 98.073784)">3a  MPC | ROUTE GUIDE</text>
   </g>
   <g id="text_8">
    <text style="font-size: 7.05px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #253746" x="35.298947" y="106.584463" transform="rotate(-0 35.298947 106.584463)">First update: solve route.</text>
   </g>
   <g id="text_9">
    <text style="font-size: 7.05px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #253746" x="35.298947" y="114.864463" transform="rotate(-0 35.298947 114.864463)">Later: shift prior route;</text>
   </g>
   <g id="text_10">
    <text style="font-size: 7.05px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #253746" x="35.298947" y="123.144394" transform="rotate(-0 35.298947 123.144394)">set guide + trust.</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 7.35px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #a86c20" x="147.078947" y="98.022028" transform="rotate(-0 147.078947 98.022028)">3b  DWA | SCREEN</text>
   </g>
   <g id="text_12">
    <text style="font-size: 7.05px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #253746" x="147.078947" y="106.584463" transform="rotate(-0 147.078947 106.584463)">Sample reachable controls</text>
   </g>
   <g id="text_13">
    <text style="font-size: 7.05px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #253746" x="147.078947" y="114.864394" transform="rotate(-0 147.078947 114.864394)">screen all 30 steps using</text>
   </g>
   <g id="text_14">
    <text style="font-size: 7.05px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #253746" x="147.078947" y="123.144394" transform="rotate(-0 147.078947 123.144394)">forecast + guide; score.</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 6.78px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #253746" x="132.697895" y="147.55459" transform="rotate(-0 132.697895 147.55459)">4  GATE: IS THE NORMAL DWA SAFE SET NONEMPTY?</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 7.45px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #16877d" x="35.298947" y="166.447906" transform="rotate(-0 35.298947 166.447906)">YES  |  NORMAL</text>
   </g>
   <g id="text_17">
    <text style="font-size: 7.05px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #253746" x="35.298947" y="174.984463" transform="rotate(-0 35.298947 174.984463)">Choose screened action;</text>
   </g>
   <g id="text_18">
    <text style="font-size: 7.05px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #253746" x="35.298947" y="183.264394" transform="rotate(-0 35.298947 183.264394)">send ranges to MPC.</text>
   </g>
   <g id="text_19">
    <text style="font-size: 7.05px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #253746" x="35.298947" y="191.546391" transform="rotate(-0 35.298947 191.546391)">Optional recentering:</text>
   </g>
   <g id="text_20">
    <text style="font-size: 7.05px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #253746" x="35.298947" y="199.824463" transform="rotate(-0 35.298947 199.824463)">re-screen or revert.</text>
   </g>
   <g id="text_21">
    <text style="font-weight: 700; font-size: 7.45px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #a45b4a" x="142.503158" y="166.447906" transform="rotate(-0 142.503158 166.447906)">NO  |  EMERGENCY</text>
   </g>
   <g id="text_22">
    <text style="font-size: 7.05px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #253746" x="142.503158" y="174.984394" transform="rotate(-0 142.503158 174.984394)">Screen emergency actions;</text>
   </g>
   <g id="text_23">
    <text style="font-size: 7.05px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #253746" x="142.503158" y="183.264394" transform="rotate(-0 142.503158 183.264394)">use one only if it passes.</text>
   </g>
   <g id="text_24">
    <text style="font-size: 7.05px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #253746" x="142.503158" y="191.544463" transform="rotate(-0 142.503158 191.544463)">If none passes, stop.</text>
   </g>
   <g id="text_25">
    <text style="font-weight: 700; font-size: 7.55px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #425466" x="35.298947" y="220.473857" transform="rotate(-0 35.298947 220.473857)">5  PLAN NEXT + EXECUTE</text>
   </g>
   <g id="text_26">
    <text style="font-size: 7px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #253746" x="35.298947" y="228.971523" transform="rotate(-0 35.298947 228.971523)">Solve the next MPC route with the screened bound if available.</text>
   </g>
   <g id="text_27">
    <text style="font-size: 7px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #253746" x="35.298947" y="237.251523" transform="rotate(-0 35.298947 237.251523)">Execute one verified action for 0.1 s; observe and repeat.</text>
