   <g id="text_1">
    <text style="font-weight: 700; font-size: 8.58px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #253746" x="30.96" y="11.286475" transform="rotate(-0 30.96 11.286475)">SHARED-FORECAST PLANNER  |  UPDATE LOOP</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 7.26px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #425466" x="38.88" y="23.838809" transform="rotate(-0 38.88 23.838809)">1  OBSERVE + INITIALIZE</text>
   </g>
   <g id="text_3">
    <text style="font-size: 6.54px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #253746" x="38.88" y="31.572417" transform="rotate(-0 38.88 31.572417)">UAV state, goal, latest 10 observations and previous MPC sequence.</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 7.26px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #16877d" x="38.88" y="52.638809" transform="rotate(-0 38.88 52.638809)">2  PREDICT ONCE, SHARE</text>
   </g>
   <g id="text_5">
    <text style="font-size: 6.54px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #253746" x="38.88" y="60.372417" transform="rotate(-0 38.88 60.372417)">Causal LSTM predicts 30 time-aligned obstacle positions (3 s).</text>
   </g>
   <g id="text_6">
    <text style="font-size: 6.54px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #253746" x="38.88" y="67.57248" transform="rotate(-0 38.88 67.57248)">Broadcast this same forecast to MPC and DWA.</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 7.14px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #4b729d" x="38.88" y="95.807684" transform="rotate(-0 38.88 95.807684)">3a  MPC | ROUTE GUIDE</text>
   </g>
   <g id="text_8">
    <text style="font-size: 6.42px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #253746" x="38.88" y="103.543244" transform="rotate(-0 38.88 103.543244)">Optimize the 30-step route</text>
   </g>
   <g id="text_9">
    <text style="font-size: 6.42px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #253746" x="38.88" y="110.741426" transform="rotate(-0 38.88 110.741426)">with the shared forecast;</text>
   </g>
   <g id="text_10">
    <text style="font-size: 6.42px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #253746" x="38.88" y="117.941363" transform="rotate(-0 38.88 117.941363)">output guide + trust.</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 6.96px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #a86c20" x="162" y="95.761104" transform="rotate(-0 162 95.761104)">3b  DWA | ACTION SCREEN</text>
   </g>
   <g id="text_12">
    <text style="font-size: 6.42px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #253746" x="162" y="103.541426" transform="rotate(-0 162 103.541426)">Sample reachable controls</text>
   </g>
   <g id="text_13">
    <text style="font-size: 6.42px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #253746" x="162" y="110.741363" transform="rotate(-0 162 110.741363)">screen 10 / 30 steps using</text>
   </g>
   <g id="text_14">
    <text style="font-size: 6.42px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #253746" x="162" y="117.941363" transform="rotate(-0 162 117.941363)">forecast + guide; score.</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 6.78px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #253746" x="146.16" y="147.55459" transform="rotate(-0 146.16 147.55459)">4  GATE: IS THE NORMAL DWA SAFE SET NONEMPTY?</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 6.9px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #16877d" x="38.88" y="166.305577" transform="rotate(-0 38.88 166.305577)">YES  |  NORMAL</text>
   </g>
   <g id="text_17">
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #253746" x="38.88" y="173.992734" transform="rotate(-0 38.88 173.992734)">Choose top-scored safe action;</text>
   </g>
   <g id="text_18">
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #253746" x="38.88" y="181.192734" transform="rotate(-0 38.88 181.192734)">bound MPC's first input.</text>
   </g>
   <g id="text_19">
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #253746" x="38.88" y="188.392734" transform="rotate(-0 38.88 188.392734)">If clear &gt;1 m &amp; cross-track &gt;0.5 m,</text>
   </g>
   <g id="text_20">
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #253746" x="38.88" y="195.592734" transform="rotate(-0 38.88 195.592734)">recenter; re-screen, else revert.</text>
   </g>
   <g id="text_21">
    <text style="font-weight: 700; font-size: 6.9px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #a45b4a" x="156.96" y="166.305577" transform="rotate(-0 156.96 166.305577)">NO  |  EMERGENCY</text>
   </g>
   <g id="text_22">
    <text style="font-size: 6.18px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #253746" x="156.96" y="174.039256" transform="rotate(-0 156.96 174.039256)">Screen emergency actions;</text>
   </g>
   <g id="text_23">
    <text style="font-size: 6.18px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #253746" x="156.96" y="181.239256" transform="rotate(-0 156.96 181.239256)">use one only if it passes.</text>
   </g>
   <g id="text_24">
    <text style="font-size: 6.18px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #253746" x="156.96" y="188.439316" transform="rotate(-0 156.96 188.439316)">If none passes, stop.</text>
   </g>
   <g id="text_25">
    <text style="font-weight: 700; font-size: 7.02px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #425466" x="38.88" y="220.336699" transform="rotate(-0 38.88 220.336699)">5  RE-SOLVE + EXECUTE</text>
   </g>
   <g id="text_26">
    <text style="font-size: 6.36px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #253746" x="38.88" y="228.085898" transform="rotate(-0 38.88 228.085898)">Re-solve MPC with the safe-set bound when available.</text>
   </g>
   <g id="text_27">
    <text style="font-size: 6.36px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #253746" x="38.88" y="235.285898" transform="rotate(-0 38.88 235.285898)">Execute the screened action for 0.1 s; update and repeat.</text>
   </g>
   <g id="text_28">
    <text style="font-size: 7.3px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #425466" x="13.409089" y="129.6" transform="rotate(-90 13.409089 129.6)">repeat every 0.1 s</text>
   </g>
  </g>
 </g>
