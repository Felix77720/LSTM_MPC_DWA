   <g id="text_1">
    <text style="font-weight: 700; font-size: 7.3px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #16877d" x="13.32" y="10.88916" transform="rotate(-0 13.32 10.88916)">1  OBSERVE → FORECAST</text>
   </g>
   <g id="text_2">
    <text style="font-size: 6.7px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #253746" x="13.32" y="22.613821" transform="rotate(-0 13.32 22.613821)">10 observations → LSTM → 30 positions (3 s)</text>
   </g>
   <g id="text_3">
    <text style="font-size: 6.7px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #253746" x="13.32" y="30.173821" transform="rotate(-0 13.32 30.173821)">The time-aligned forecast feeds both MPC and DWA.</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 7.3px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #4b729d" x="13.32" y="59.129089" transform="rotate(-0 13.32 59.129089)">2a  MPC | route optimizer</text>
   </g>
   <g id="text_5">
    <text style="font-size: 6.7px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #253746" x="13.32" y="70.853887" transform="rotate(-0 13.32 70.853887)">30-step forecast enters cost.</text>
   </g>
   <g id="text_6">
    <text style="font-size: 6.7px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #253746" x="13.32" y="78.413821" transform="rotate(-0 13.32 78.413821)">Shift guide; compute trust.</text>
   </g>
   <g id="text_7">
    <text style="font-size: 6.7px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #253746" x="13.32" y="85.973887" transform="rotate(-0 13.32 85.973887)">Return route and command.</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 7.3px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #a86c20" x="138.6" y="59.129089" transform="rotate(-0 138.6 59.129089)">2b  DWA | action selector</text>
   </g>
   <g id="text_9">
    <text style="font-size: 6.7px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #253746" x="138.6" y="70.853821" transform="rotate(-0 138.6 70.853821)">Use forecast and MPC guide.</text>
   </g>
   <g id="text_10">
    <text style="font-size: 6.7px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #253746" x="138.6" y="78.413821" transform="rotate(-0 138.6 78.413821)">Split guided/exploration samples.</text>
   </g>
   <g id="text_11">
    <text style="font-size: 6.7px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #253746" x="138.6" y="85.973887" transform="rotate(-0 138.6 85.973887)">Roll out, screen, score.</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 7.3px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #4b729d" x="13.32" y="131.12916" transform="rotate(-0 13.32 131.12916)">3  COUPLE + RE-SOLVE</text>
   </g>
   <g id="text_13">
    <text style="font-size: 6.7px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #253746" x="13.32" y="142.853821" transform="rotate(-0 13.32 142.853821)">Passing DWA controls bound MPC's first input.</text>
   </g>
   <g id="text_14">
    <text style="font-size: 6.7px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #253746" x="13.32" y="150.413821" transform="rotate(-0 13.32 150.413821)">Recentered commands replace it only if re-screening passes.</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 7.3px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #425466" x="13.32" y="172.88916" transform="rotate(-0 13.32 172.88916)">4  EXECUTE + REPEAT</text>
   </g>
   <g id="text_16">
    <text style="font-size: 6.7px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #253746" x="13.32" y="184.613821" transform="rotate(-0 13.32 184.613821)">Apply screened action for 0.1 s; then repeat.</text>
   </g>
   <g id="text_17">
    <text style="font-size: 6.7px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #253746" x="13.32" y="192.173821" transform="rotate(-0 13.32 192.173821)">If no emergency action passes, stop.</text>
   </g>
  </g>
 </g>
